    <circle cx="0" cy="0" r="50" fill="#0A1428" stroke="#60A5FA" stroke-opacity="0.35"/>
    <path d="M-16 0L-2 14L18 -12" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
