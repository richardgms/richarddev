<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1080" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B18"/>
      <stop offset="1" stop-color="#0A1428"/>
    </linearGradient>
    <linearGradient id="accent" x1="360" y1="120" x2="840" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#005DED" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="blur" x="0" y="0" width="1200" height="630" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="250" cy="120" r="170" fill="#005DED" fill-opacity="0.22" filter="url(#blur)"/>
  <circle cx="980" cy="510" r="220" fill="#60A5FA" fill-opacity="0.12" filter="url(#blur)"/>
  <circle cx="870" cy="120" r="130" fill="#005DED" fill-opacity="0.18" filter="url(#blur)"/>

  <rect x="72" y="72" width="1056" height="486" rx="40" fill="#0A1326" fill-opacity="0.72" stroke="white" stroke-opacity="0.08"/>
  <rect x="92" y="92" width="1016" height="446" rx="30" stroke="url(#accent)" stroke-opacity="0.45"/>

  <text x="120" y="180" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="4">RICHARD GOMES</text>
  <text x="120" y="275" fill="#FFFFFF" font-family="Outfit, Inter, Arial, sans-serif" font-size="72" font-weight="800">Sites e Landing Pages</text>
  <text x="120" y="340" fill="#A3AED0" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500">Presença digital que converte visitantes em clientes.</text>

  <g transform="translate(120 402)">
